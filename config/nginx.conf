server {
    listen 80;
    listen [::]:80;
    server_name jordan.shurmer.family jordan.shurmer.local;
    root /var/www/jordan.shurmer.family/html;

    index index.php index.html;

    location / {
        try_files $uri $uri.html $uri/ @rewrite;
    }

    location @rewrite {
        if (-f $document_root$uri.php) { rewrite ^ $uri.php last; }
        return 404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
}
