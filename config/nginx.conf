server {
    listen 80;
    listen [::]:80;
    server_name jordan.shurmer.family www.jordan.shurmer.family;
    root /var/www/jordan.shurmer.family/html;

    index index.php index.html;

    location / {
        try_files $uri $uri.html @rewrite;
    }

    location @rewrite {
        # ensure urls end in slash to users, but handled without a slash internally
        if ($uri ~* [^/]$) {
            return 308 $uri/$is_args$args;
        }
        rewrite ^(.+)/$ $1 ;

        # look for php files like foobar.GET.php, foobar.POST.php etc.
        if (-f $document_root$uri.$request_method.php) { rewrite ^ $uri.$request_method.php last; }
        if (-f $document_root$uri/index.$request_method.php) { rewrite ^ $uri/index.$request_method.php last; }
        if (-f $document_root$uri.php) { rewrite ^ $uri.php last; }
        if (-f $document_root$uri/index.php) { rewrite ^ $uri/index.php last; }

        return 404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
}
